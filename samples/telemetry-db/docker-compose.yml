services:
  db:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  tests:
    image: postgres:16.6-bookworm
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
    volumes:
      - ./sql:/sample/sql:ro
      - ./tests:/sample/tests:ro
    entrypoint: ["bash", "/sample/tests/run.sh"]
